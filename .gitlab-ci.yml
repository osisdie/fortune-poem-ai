stages:
  - lint
  - build

# ─── Stage 1: Lint (~30s) ─────────────────────

lint:python:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install "flake8>=7.0"
    - flake8 --config .flake8 .

lint:frontend:
  stage: lint
  image: node:22-alpine
  before_script:
    - cd web && npm ci
  script:
    - npx tsc --noEmit
    - npx next lint

# ─── Stage 2: Build (~2min) ───────────────────

build:frontend:
  stage: build
  image: node:22-alpine
  before_script:
    - cd web && npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - web/.next/
    expire_in: 1 day

build:docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t bless-you-app .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
